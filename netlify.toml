[build]
  command = "bun run build || npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/api/shopify/graphql"
  to = "/.netlify/functions/shopify"
  status = 200

[[redirects]]
  from = "/api/shopify/*"
  to = "/.netlify/functions/shopify"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
